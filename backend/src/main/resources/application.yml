server:
  address: ${SERVER_ADDRESS:127.0.0.1}
  port: ${SERVER_PORT:8080}
spring:
  application.name: knowledge-base-backend
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 51MB
  datasource:
    url: jdbc:h2:file:${DATA_ROOT:./data}/db/knowledge;DB_CLOSE_ON_EXIT=FALSE
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  flyway:
    locations: classpath:db/migration
management.endpoints.web.exposure.include: health,info
management.endpoint.health.show-details: never
app:
  embedding:
    base-url: ${OLLAMA_BASE_URL:http://127.0.0.1:11434}
    model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text-v2-moe:latest}
